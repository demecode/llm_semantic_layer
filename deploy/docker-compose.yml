services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file:
      - ../.env
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ../dbt/target:/app/dbt/target:ro
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ui:
    build:
      context: ..
      dockerfile: deploy/ui.Dockerfile
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: