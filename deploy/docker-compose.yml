services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file:
      - ../.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_CHAT_ENDPOINT=http://ollama:11434/api/chat
      - OLLAMA_MODEL=llama3.2:3b
    volumes:
      - ../dbt/target:/app/dbt/target:ro
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  ui:
    build:
      context: ..
      dockerfile: deploy/ui.Dockerfile
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Don't fail just because there are no models yet
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  ollama_data: