id: top_n
name: Top-N Ranking
description: Rank entities by a governed metric over a time range
intent: ranking

defaults:
  n: 10
  grain: month
  window:
    last_n_months: 12
  anchor_end_date: "2025-10-01"

ranking:
  metric: total_spend
  dimension: vendor_name

output:
  type: ranking
