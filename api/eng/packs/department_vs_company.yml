id: department_vs_company
title: Digital Solutions vs Rest of Company
description: Compare Digital Solutions spend to the rest of the company over time.
defaults:
  grain: month
  window:
    last_n_months: 24

comparison:
  left_metric: digital_solutions_spend
  right_metric: rest_of_company_spend

narrative:
  template: >
    In the latest period, Digital Solutions accounted for {left_share_latest_pct} of total company spend.
    Digital Solutions MoM: {left_mom_pct}. Rest of Company MoM: {right_mom_pct}.